[workspace]
members = ["crates/ue-assets"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "open-kf"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bevy = "0.19.1"
# Collision queries (shape casts against level geometry). Default features off:
# no debug rendering, picking or scenes needed.
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "parallel", "xpbd_joints"] }
ue-assets = { path = "crates/ue-assets" }
# Sound output (already used by Bevy's audio): our mixer in src/audio.rs feeds it.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "lewton"] }
# Networking (experimental multiplayer, src/net/): listen server and clients
# over UDP with netcode.io connections. Prediction and interpolation are
# compiled in for the next steps (pawns, zeds).
lightyear = { version = "0.30.1", default-features = false, features = ["std", "client", "server", "replication", "prediction", "interpolation", "netcode", "udp"] }
serde = { version = "1", features = ["derive"] }
# lightyear's own message encoding; used to log how many bytes a zed
# snapshot takes (net/zeds.rs).
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

# Bevy is very slow when built without optimisation. Optimise dependencies
# fully and our own code a little, so debug builds stay usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
